<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Gabapentin Feedback Questionnaire</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="page">

    <div class="wrap">

        <!-- PROGRESS -->
        <div class="progress-wrap">

            <div class="progress-head">

                <span id="stepLabel">
                    Step 1 of 6
                </span>

                <span>
                    Gabapentin Feedback
                </span>

            </div>

            <div class="progress-track">

                <div
                    class="progress-fill"
                    id="progressFill"
                    style="width:16.67%"
                ></div>

            </div>

        </div>


        <!-- FORM CONTENT -->
        <div id="stepArea"></div>

    </div>


    <!-- SPONSOR -->
    <div class="sponsor-strip">

        <img
            src="sponsor-strip.png"
            alt="Gabapin product sponsors"
        >

    </div>

</div>


<script type="module">

/* =========================================================
   IMPORT CONFIGURATION
========================================================= */

import {
    QUESTIONS
} from './questions-config.js';

import {
    firebaseConfig,
    COLLECTION_NAME
} from './firebase-config.js';


/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    initializeApp
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';


/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================================================
   FORM VARIABLES
========================================================= */

const totalSteps = QUESTIONS.length + 1;

let current = 0;


/*
    Answers are stored as:

    answers = {
        question1: Set([
            "Option A",
            "Option B",
            "Other"
        ])
    }
*/

const answers = {};


/*
    Other text values

    Example:

    otherValues = {
        question1: "My custom answer"
    }
*/

const otherValues = {};


/*
    Registration details
*/

const details = {

    name: '',

    city: '',

    specialty: ''

};


/* =========================================================
   DOM ELEMENTS
========================================================= */

const stepArea =
    document.getElementById('stepArea');

const stepLabel =
    document.getElementById('stepLabel');

const progressFill =
    document.getElementById('progressFill');


/* =========================================================
   HTML ESCAPE FUNCTION
========================================================= */

function esc(value) {

    return String(value ?? '')
        .replace(
            /[&<>'"]/g,
            char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[char])
        );

}


/* =========================================================
   UPDATE PROGRESS
========================================================= */

function updateProgress() {

    stepLabel.textContent =
        `Step ${current + 1} of ${totalSteps}`;

    progressFill.style.width =
        `${((current + 1) / totalSteps) * 100}%`;

}


/* =========================================================
   REGISTRATION / DETAILS PAGE
========================================================= */

function renderDetails() {

    stepArea.innerHTML = `

        <div class="form-shell">

            <img
                class="logo-top"
                src="logo.png"
                alt="HYMNS logo"
            >

            <div class="kicker">
                Before we begin
            </div>

            <h1>
                Your details
            </h1>


            <!-- NAME -->

            <div class="field">

                <label>
                    Name
                </label>

                <input
                    id="nameInput"
                    type="text"
                    placeholder="Full name"
                    value="${esc(details.name)}"
                >

            </div>


            <!-- CITY -->

            <div class="field">

                <label>
                    City
                </label>

                <input
                    id="cityInput"
                    type="text"
                    placeholder="Your city"
                    value="${esc(details.city)}"
                >

            </div>


            <!-- SPECIALTY -->

            <div class="field">

                <label>
                    Specialty
                </label>

                <input
                    id="specialtyInput"
                    type="text"
                    placeholder="Your specialty"
                    value="${esc(details.specialty)}"
                >

            </div>


            <!-- ERROR -->

            <div
                id="detailsError"
                class="error-text"
                style="display:none"
            >
                Please fill in all three fields.
            </div>


            <!-- BUTTON -->

            <div class="nav-row">

                <button
                    class="btn btn-primary"
                    id="nextBtn"
                    type="button"
                >
                    Continue
                </button>

            </div>

        </div>

    `;


    /* =====================================================
       CONTINUE BUTTON
    ===================================================== */

    document
        .getElementById('nextBtn')
        .onclick = function () {


            details.name =
                document
                    .getElementById('nameInput')
                    .value
                    .trim();


            details.city =
                document
                    .getElementById('cityInput')
                    .value
                    .trim();


            details.specialty =
                document
                    .getElementById('specialtyInput')
                    .value
                    .trim();


            /*
                Validate details
            */

            if (
                !details.name ||
                !details.city ||
                !details.specialty
            ) {

                document
                    .getElementById('detailsError')
                    .style.display = 'block';

                return;

            }


            /*
                Go to first question
            */

            current++;

            render();

        };

}


/* =========================================================
   QUESTION PAGE
========================================================= */

function renderQuestion() {

    /*
        Current question
    */

    const q =
        QUESTIONS[current - 1];


    /*
        Create Set for multiple selection
    */

    if (!answers[q.id]) {

        answers[q.id] =
            new Set();

    }


    const selected =
        answers[q.id];


    /*
        Find Other option
    */

    const otherOpt =
        q.options.find(
            option =>
                option
                    .toLowerCase()
                    .includes('other')
        );


    /* =====================================================
       RENDER OPTIONS
    ===================================================== */

    const options =
        q.options
            .map(option => `

                <div
                    class="
                        option-row
                        ${selected.has(option)
                            ? 'selected'
                            : ''
                        }
                    "
                    data-opt="${esc(option)}"
                >

                    <input
                        type="checkbox"
                        name="${esc(q.id)}[]"
                        value="${esc(option)}"
                        ${
                            selected.has(option)
                                ? 'checked'
                                : ''
                        }
                    >

                    <span>
                        ${esc(option)}
                    </span>

                </div>

            `)
            .join('');


    /* =====================================================
       QUESTION HTML
    ===================================================== */

    stepArea.innerHTML = `

        <div class="question-card">


            <!-- QUESTION NUMBER -->

            <div class="q-number">

                Question
                ${current}
                of
                ${QUESTIONS.length}

            </div>


            <!-- QUESTION -->

            <h2>
                ${esc(q.label)}
            </h2>


            <!-- HELP -->

            <p
                style="
                    color:#647897;
                    font-size:13px;
                    margin-top:-12px;
                    margin-bottom:20px;
                "
            >
                You can select more than one option.
            </p>


            <!-- OPTIONS -->

            <div class="options-list">

                ${options}

            </div>


            <!-- OTHER INPUT -->

            ${
                otherOpt
                ?

                `

                <div
                    class="other-box"
                    id="otherBox"
                    style="
                        display:
                        ${
                            selected.has(otherOpt)
                                ? 'block'
                                : 'none'
                        };
                    "
                >

                    <label>
                        Other — Please specify
                    </label>

                    <input
                        id="otherInput"
                        type="text"
                        placeholder="Please specify your answer"
                        value="${esc(
                            otherValues[q.id] || ''
                        )}"
                    >

                </div>

                `

                :

                ''

            }


            <!-- ERROR -->

            <div
                id="qError"
                class="error-text"
                style="display:none"
            >
                Please select at least one option.
            </div>


            <!-- FIREBASE STATUS -->

            <div
                id="firebaseStatus"
                class="firebase-status"
            ></div>


            <!-- NAVIGATION -->

            <div class="nav-row">


                <button
                    class="btn btn-ghost"
                    id="backBtn"
                    type="button"
                >
                    Back
                </button>


                <button
                    class="btn btn-primary"
                    id="nextBtn"
                    type="button"
                >

                    ${
                        current === QUESTIONS.length
                            ? 'Submit'
                            : 'Next'
                    }

                </button>


            </div>


        </div>

    `;


    /* =====================================================
       OPTION ROW CLICK
    ===================================================== */

    stepArea
        .querySelectorAll('.option-row')
        .forEach(row => {


            row.addEventListener(
                'click',
                function (event) {


                    /*
                        If directly clicking checkbox,
                        let checkbox change handler
                        manage selection.
                    */

                    if (
                        event.target.tagName ===
                        'INPUT'
                    ) {

                        return;

                    }


                    const option =
                        row.dataset.opt;


                    const checkbox =
                        row.querySelector(
                            'input'
                        );


                    /*
                        Toggle option
                    */

                    if (
                        selected.has(option)
                    ) {

                        selected.delete(option);

                        checkbox.checked =
                            false;

                        row.classList.remove(
                            'selected'
                        );

                    }

                    else {

                        selected.add(option);

                        checkbox.checked =
                            true;

                        row.classList.add(
                            'selected'
                        );

                    }


                    /*
                        Show Other input
                    */

                    if (
                        otherOpt &&
                        option === otherOpt
                    ) {

                        const otherBox =
                            document
                                .getElementById(
                                    'otherBox'
                                );


                        if (otherBox) {

                            otherBox.style.display =
                                selected.has(
                                    otherOpt
                                )
                                    ? 'block'
                                    : 'none';

                        }

                    }

                }
            );

        });


    /* =====================================================
       CHECKBOX CHANGE
    ===================================================== */

    stepArea
        .querySelectorAll(
            '.option-row input[type="checkbox"]'
        )
        .forEach(checkbox => {


            checkbox.addEventListener(
                'change',
                function () {


                    const row =
                        checkbox.closest(
                            '.option-row'
                        );


                    const option =
                        row.dataset.opt;


                    /*
                        Add selected
                    */

                    if (
                        checkbox.checked
                    ) {

                        selected.add(
                            option
                        );

                        row.classList.add(
                            'selected'
                        );

                    }


                    /*
                        Remove selected
                    */

                    else {

                        selected.delete(
                            option
                        );

                        row.classList.remove(
                            'selected'
                        );

                    }


                    /*
                        Other input
                    */

                    if (
                        otherOpt &&
                        option === otherOpt
                    ) {

                        const otherBox =
                            document
                                .getElementById(
                                    'otherBox'
                                );


                        if (otherBox) {

                            otherBox.style.display =
                                checkbox.checked
                                    ? 'block'
                                    : 'none';

                        }

                    }

                }
            );

        });


    /* =====================================================
       OTHER TEXT INPUT
    ===================================================== */

    document
        .getElementById('otherInput')
        ?.addEventListener(
            'input',
            function (event) {

                otherValues[q.id] =
                    event.target.value;

            }
        );


    /* =====================================================
       BACK BUTTON
    ===================================================== */

    document
        .getElementById('backBtn')
        .onclick = function () {

            current--;

            render();

        };


    /* =====================================================
       NEXT / SUBMIT BUTTON
    ===================================================== */

    document
        .getElementById('nextBtn')
        .onclick = async function () {


            const error =
                document
                    .getElementById(
                        'qError'
                    );


            /*
                Save Other value
            */

            if (
                otherOpt &&
                selected.has(otherOpt)
            ) {

                otherValues[q.id] =
                    document
                        .getElementById(
                            'otherInput'
                        )
                        ?.value
                        .trim() || '';

            }


            /*
                Check option selection
            */

            if (
                selected.size === 0
            ) {

                error.textContent =
                    'Please select at least one option.';

                error.style.display =
                    'block';

                return;

            }


            /*
                Check Other text
            */

            if (
                otherOpt &&
                selected.has(otherOpt) &&
                !otherValues[q.id]
            ) {

                error.textContent =
                    'Please specify your Other response.';

                error.style.display =
                    'block';

                return;

            }


            /*
                Submit
            */

            if (
                current ===
                QUESTIONS.length
            ) {

                await submitAll();

            }

            else {

                current++;

                render();

            }

        };

}


/* =========================================================
   SUBMIT TO FIREBASE
========================================================= */

async function submitAll() {


    const btn =
        document
            .getElementById(
                'nextBtn'
            );


    const status =
        document
            .getElementById(
                'firebaseStatus'
            );


    /*
        Disable button
    */

    btn.disabled =
        true;


    btn.textContent =
        'Submitting…';


    status.textContent =
        'Saving response…';


    try {


        /* =================================================
           CREATE PAYLOAD
        ================================================= */

        const payload = {

            name:
                details.name,

            city:
                details.city,

            specialty:
                details.specialty,


            answers:

                Object.fromEntries(

                    QUESTIONS.map(
                        q => {


                            const selectedOptions =
                                Array.from(
                                    answers[q.id] ||
                                    []
                                );


                            const otherOption =
                                q.options.find(
                                    option =>
                                        option
                                            .toLowerCase()
                                            .includes(
                                                'other'
                                            )
                                );


                            return [

                                q.id,

                                {

                                    /*
                                        All selected
                                        options
                                    */

                                    selected:
                                        selectedOptions,


                                    /*
                                        Other answer
                                    */

                                    other:

                                        otherOption &&
                                        selectedOptions
                                            .includes(
                                                otherOption
                                            )

                                            ?

                                            (
                                                otherValues[
                                                    q.id
                                                ] || ''
                                            )

                                            :

                                            ''

                                }

                            ];

                        }
                    )

                ),


            submittedAt:
                serverTimestamp()

        };


        /* =================================================
           SAVE TO FIREBASE
        ================================================= */

        await addDoc(

            collection(
                db,
                COLLECTION_NAME
            ),

            payload

        );


        /* =================================================
           SUCCESS
        ================================================= */

        status.className =
            'firebase-status ok';


        status.textContent =
            'Saved successfully. Opening dashboard…';


        /*
            Open dashboard
        */

        setTimeout(
            () => {

                window.location.href =
                    'dashboard.html';

            },
            700
        );


    }


    catch (error) {


        console.error(
            error
        );


        /*
            Re-enable button
        */

        btn.disabled =
            false;


        btn.textContent =
            'Submit';


        status.className =
            'firebase-status error';


        status.textContent =

            `Firebase error: ${
                error?.code ||
                error?.message ||
                'unknown error'
            }`;

    }

}


/* =========================================================
   MAIN RENDER FUNCTION
========================================================= */

function render() {


    /*
        Update progress
    */

    updateProgress();


    /*
        Step 0 = Registration

        Step 1 onwards = Questions
    */

    if (
        current === 0
    ) {

        renderDetails();

    }

    else {

        renderQuestion();

    }

}


/* =========================================================
   START FORM
========================================================= */

render();

</script>

</body>

</html>
