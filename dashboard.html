<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Gabapentin Feedback Results / Responses</title><link rel="stylesheet" href="styles.css"></head><body><div class="page"><a class="home-btn dashboard-home" href="index.html">Home</a><div class="dashboard-wrap"><img class="dash-logo" src="logo.png" alt="HYMNS logo"><div class="dash-top"><div class="dash-title"><h1>Gabapentin Feedback Results / Responses</h1><div class="count-pill"><span id="responseCount">0</span> responses</div><div id="connectionStatus" class="connection-status">Connecting to Firebase…</div></div></div><div class="grid" id="chartsGrid"></div></div><div class="sponsor-strip"><img src="sponsor-strip.png" alt="Gabapin product sponsors"></div></div><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><script type="module">
import { QUESTIONS } from './questions-config.js';import { firebaseConfig,COLLECTION_NAME } from './firebase-config.js';import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import { getFirestore,collection,onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp(firebaseConfig),db=getFirestore(app),grid=document.getElementById('chartsGrid'),charts={},PALETTE=['#ef6b24','#496aa6','#f5a524','#62a6ff','#25c991','#c43c2f'];
QUESTIONS.forEach(q=>{const card=document.createElement('div');card.className='chart-card';card.innerHTML=`<h3>${q.label}</h3><div class="chart-box"><canvas id="chart-${q.id}"></canvas></div><div class="legend-row" id="legend-${q.id}"></div><div class="other-list" id="other-${q.id}" style="display:none"></div>`;grid.appendChild(card);charts[q.id]=new Chart(document.getElementById(`chart-${q.id}`),{type:'doughnut',data:{labels:[...q.options.filter(o=>!o.toLowerCase().includes('other')),'Other'],datasets:[{data:[...q.options.filter(o=>!o.toLowerCase().includes('other')).map(()=>0),0],backgroundColor:PALETTE,borderWidth:2,borderColor:'#f8fafc'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{display:false}}}})});
onSnapshot(collection(db,COLLECTION_NAME),snap=>{const status=document.getElementById('connectionStatus');status.className='connection-status ok';status.textContent='Live connection active';document.getElementById('responseCount').textContent=snap.size;QUESTIONS.forEach(q=>{const regular=q.options.filter(o=>!o.toLowerCase().includes('other'));const counts={};regular.forEach(o=>counts[o]=0);let otherCount=0;const otherTexts=[];snap.forEach(d=>{const a=d.data().answers?.[q.id];if(Array.isArray(a)){a.forEach(x=>{if(counts[x]!==undefined)counts[x]++})}else if(a&&typeof a==='object'){(a.selected||[]).forEach(x=>{if(counts[x]!==undefined)counts[x]++;if(x.toLowerCase().includes('other')){otherCount++;if(a.other)otherTexts.push(a.other)}});}});charts[q.id].data.datasets[0].data=[...regular.map(o=>counts[o]),otherCount];charts[q.id].update();const legend=document.getElementById(`legend-${q.id}`);legend.innerHTML=[...regular,'Other'].map((o,i)=>`<div class="legend-item"><span class="legend-dot" style="background:${PALETTE[i%PALETTE.length]}"></span><span>${o}</span><span class="legend-count">${[...regular.map(x=>counts[x]),otherCount][i]}</span></div>`).join('');const ol=document.getElementById(`other-${q.id}`);if(otherTexts.length){ol.style.display='block';ol.innerHTML='<b>Other responses:</b> '+otherTexts.map(t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))).join(', ')}else ol.style.display='none'})},err=>{const s=document.getElementById('connectionStatus');s.className='connection-status error';s.textContent=`Firebase connection failed: ${err?.code||err?.message||'unknown error'}`});
</script></body></html>
